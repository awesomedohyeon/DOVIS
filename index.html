<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B5BDB">
<title>DOVIS</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="application-name" content="DOVIS">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 120 120%27%3E%3Crect width=%27120%27 height=%27120%27 rx=%2728%27 fill=%27%233B5BDB%27/%3E%3Cg transform=%27translate(12 10) scale(.8)%27%3E%3Cpath d=%27M38 22 H82 A20 20 0 0 1 102 42 V78 A20 20 0 0 1 82 98 H46 L24 112 L28 94 A20 20 0 0 1 18 78 V42 A20 20 0 0 1 38 22 Z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%278%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M38 22 H82 A20 20 0 0 1 102 42 V48 H18 V42 A20 20 0 0 1 38 22 Z%27 fill=%27%23fff%27/%3E%3Cpath d=%27M44 72 L55 83 L77 61%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%279%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --accent:#3B5BDB;
  --bg:#F6F7F9; --card:#FFFFFF; --text:#17181A; --sub:#5F6368; --sub2:#4A4F57;
  --line:#E6E8EC; --line2:#EEF0F3; --chip:#F1F2F4; --input:#F6F7F9; --border:#D5D8DE;
  --drum:#6741D9; --work:#C2410C; --etc:#0B7285; --ok:#2B8A3E; --okbg:#EBF7EE; --okt:#1E5631; --danger:#E03131;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --tint:color-mix(in srgb, var(--accent) 10%, var(--card));
  --tint2:color-mix(in srgb, var(--accent) 16%, var(--card));
}
[data-theme="dark"]{
  --bg:#111317; --card:#1B1E24; --text:#ECEEF2; --sub:#A3A9B4; --sub2:#BCC1CA;
  --line:#2A2E36; --line2:#242830; --chip:#262A32; --input:#22262D; --border:#3A3F48;
  --okbg:#17301F; --okt:#A9E2B8; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{padding:calc(18px + env(safe-area-inset-top)) 20px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top .k{font-size:13px;color:var(--sub);font-weight:500}
.top h1{margin:2px 0 0;font-size:23px;font-weight:700;letter-spacing:-.5px}
.brand{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px;font-weight:700}
.muted{color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{height:44px;padding:0 16px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border);font-weight:500}
.btn.soft{background:var(--tint);color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--border);background:var(--input);font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.hero{background:var(--accent);color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.hero .k{font-size:12px;opacity:.9;font-weight:500}
.hero .t{font-size:15px;line-height:1.5}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hero .acts button{height:34px;padding:0 12px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:700}
.tl{display:flex;flex-direction:column;gap:8px}
.tli{display:flex;gap:10px}
.tli .tm{width:44px;flex:none;font-size:12px;color:var(--sub);padding-top:13px}
.ev{flex:1;border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;text-align:left;border:none;width:100%}
.ev .tt{font-size:15px;font-weight:700}
.ev .st{font-size:12px;color:var(--sub2)}
.ev.fixed{background:var(--tint)}
.ev.off{background:var(--chip);opacity:.8}
.ev.off .tt{text-decoration:line-through;color:var(--sub)}
.ev.task{background:var(--card);border:1.5px solid var(--c,var(--accent))}
.ev.task.done{background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--card))}
.ev.task.miss{border-color:var(--border);background:var(--chip)}
.ev.task.miss .tt{text-decoration:line-through;color:var(--sub)}
.ev.need{box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 25%,transparent)}
.ev.unknown{background:var(--card);border:1.5px dashed var(--c,var(--accent))}
.travel{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--sub)}
.travel .tm{width:44px;flex:none}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--tint2);color:var(--accent);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line)}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:11px;position:relative}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs .nb{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.iconbtn{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center}
/* week */
.wk-head{display:grid;grid-template-columns:24px repeat(7,minmax(0,1fr));padding:0 6px;text-align:center;font-size:11px;color:var(--sub);border-bottom:1px solid var(--line)}
.wk-head button{border:none;background:none;padding:2px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:inherit;font-size:11px}
.wk-head .n{height:26px;width:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text)}
.wk-head .today{color:var(--accent);font-weight:700}
.wk-head .today .n{background:var(--accent);color:#fff}
.wk-all{display:grid;grid-template-columns:24px repeat(7,minmax(0,1fr));padding:4px 6px;border-bottom:1px solid var(--line);gap:0 2px;min-height:24px}
.wk-all .c{display:flex;flex-direction:column;gap:2px}
.wk-all button{border:none;font-size:9px;font-weight:700;border-radius:5px;padding:3px 2px;line-height:1.2;color:#fff;background:var(--etc)}
.wk-grid{display:grid;grid-template-columns:24px repeat(7,minmax(0,1fr))}
.wk-col{position:relative;border-left:1px solid var(--line2);background-image:linear-gradient(var(--line2) 1px,transparent 1px)}
.wk-hr{position:relative;font-size:9px;color:var(--sub)}
.wk-hr div{position:absolute;left:0}
.blk{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px;font-size:10px;line-height:1.2;overflow:hidden;text-align:left;border:none;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.blk.fx{color:#fff}
.blk.off{background:var(--chip)!important;color:var(--sub)!important;text-decoration:line-through}
.blk.tk{background:var(--card);border:1.5px solid var(--c);color:var(--text);font-weight:700}
.blk.tk.done{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.blk.tk.miss{border-color:var(--border);background:var(--chip);color:var(--sub);text-decoration:line-through;font-weight:400}
.blk.tk.need{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.blk.unk{background:var(--card);border:1.5px dashed var(--c);color:var(--text)}
.nowline{position:absolute;left:-3px;right:0;height:2px;background:var(--danger);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--sub2)}
.legend .row{gap:4px}
/* sheet */
.overlay{position:absolute;inset:0;background:rgba(15,17,20,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.overlay .bgclose{flex:1;border:none;background:transparent}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:85%;overflow-y:auto}
.handle{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--border)}
.sheet h3{margin:0;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* chat */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:keep-all}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-radius:18px 18px 4px 18px}
.msg.bot{align-self:flex-start;background:var(--card);border-radius:18px 18px 18px 4px;box-shadow:var(--shadow)}
.prop{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.slot{display:flex;gap:12px;align-items:center;background:var(--tint);border-radius:12px;padding:10px 12px}
.slot .d{display:flex;flex-direction:column;align-items:center;min-width:40px}
.slot .d b{font-size:18px}
.why{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub2);line-height:1.5}
.composer{padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.composer .qs{display:flex;gap:6px;overflow-x:auto}
.composer .qs button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px}
.composer form{display:flex;gap:8px}
.composer input{flex:1;height:46px;padding:0 16px;border:1px solid var(--border);border-radius:23px;background:var(--card)}
.send{width:46px;height:46px;border:none;border-radius:23px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub2)}
.inp{height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--input);width:100%}
textarea.inp{height:auto;padding:12px;line-height:1.5;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--chip);border-radius:12px;padding:3px}
.seg button{height:36px;border:none;border-radius:10px;background:transparent;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar div{height:8px;border-radius:4px}
.li{padding:10px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.li:last-child{border-bottom:none}
.sw{width:44px;height:44px;border-radius:22px;border:3px solid var(--card)}
.tog{width:52px;height:32px;border:none;border-radius:16px;padding:3px;display:flex;background:var(--border);flex:none}
.tog.on{justify-content:flex-end;background:var(--accent)}
.tog i{width:26px;height:26px;border-radius:13px;background:#fff;display:block}
.chk{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:none;border-radius:14px;background:var(--input);text-align:left;width:100%}
.chk.on{background:var(--tint)}
.chk .bx{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #ADB5BD;background:var(--card);display:flex;align-items:center;justify-content:center}
.chk.on .bx{background:var(--accent);border-color:var(--accent)}
.night{background:#1F2433;color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.night .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.night .g div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;gap:2px}
.night .g small{font-size:11px;color:#C4C9D4}
.night .g b{font-size:18px}
.sugg{max-height:62vh;overflow-y:auto;margin:0 12px 8px;background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.sugg .t{font-size:14px;line-height:1.5}
.toast{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:#17181A;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.empty{font-size:13px;color:var(--sub);padding:6px 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:3px;background:var(--sub);opacity:.4;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= 기본 유틸 ================= */
const DAYS=['월','화','수','목','금','토','일'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const dow=s=>(parseYmd(s).getDay()+6)%7;
const mondayOf=s=>addDays(s,-dow(s));
const weekStart=s=>addDays(s,-((dow(s)+1)%7));
const toMin=t=>{const p=String(t).split(':').map(Number);return p[0]*60+(p[1]||0);};
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
const md=s=>{const d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate();};
const dayLabel=s=>md(s)+'('+DAYS[dow(s)]+')';
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/86400000);
const durText=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(h+'시간'+(r?' '+r+'분':'')):r+'분';};
const hoursText=m=>{const h=m/60;return (Math.round(h*10)/10)+'시간';};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const roundUp5=m=>Math.ceil(m/5)*5;
function nowInfo(){const d=new Date();return {date:ymd(d),min:d.getHours()*60+d.getMinutes()};}

/* ================= 시드 데이터 ================= */
const SEM_START='2026-09-01', SEM_END='2026-12-31';
const PLACES={home:'집',school:'학교',student:'학생회관',gym:'헬스장',tutor:'과외',academy:'학원',practice:'드럼 연습실',seoul:'서울',other:'기타'};
const CATS={class:'수업',drum:'드럼',work:'과외·학원',etc:'기타'};
const TYPES={study:'과제·공부',practice:'드럼 연습',workout:'운동',etc:'기타'};
const TYPE_PLACE={study:'school',practice:'practice',workout:'gym',etc:'school'};
function seed(){
  const F=(id,day,start,end,title,short,cat,place,mode)=>({id,day,start,end,title,short,cat,place,mode:mode||'fixed'});
  const E=(date,start,end,title,short,cat,place,extra)=>Object.assign({id:'e'+uid(),date,start,end,title,short,cat,place,kind:'fixed'},extra||{});
  const T=(date,start,end,title,short,type,extra)=>Object.assign({id:'t'+uid(),date,start,end,title,short,type,kind:'task',status:'scheduled',place:TYPE_PLACE[type],cat:type==='practice'?'drum':(type==='workout'?'etc':'class')},extra||{});
  return {
    v:4.9, updatedAt:0,
    settings:{accent:'#3B5BDB',dark:false,sleepMin:450,fallAsleepMin:20,wakeBeforeMin:120,latestWake:'09:00',dayEnd:'22:30',
      rules:{noAfterWork:true,preferSingle:true}},
    travel:{homeSchool:30,homeTutor:5,homeAcademy:15,schoolPractice:15,campus:5},
    fixed:[],
    skips:{},
    confirm:{},
    events:[],
    pool:[],
    daily:{},
    chat:[{id:'m0',who:'bot',text:'안녕! 나 DOVIS야.\n과제나 할 일을 말해주면 빈 시간 찾아서 배치안 보여줄게. 예) "약분 보고서 3시간, 금요일까지"'}],
    recurring:{hyunsaFrom:'2026-11-16'}
  };
}

/* ================= 상태 & 저장 ================= */
const LS_KEY='dovis-state-v1';
let S=null;
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw)return JSON.parse(raw);}catch(e){}return null;}
const VERSION='0.0.2';
const STANDALONE=!(window.claude&&window.claude.use);
function emptySeed(){const x=seed();x.fixed=[];x.events=[];x.skips={};x.confirm={};x.feel={};x.feelDow={};x.feelRef={};x.recurring={hyunsaFrom:'2099-01-05'};x.chat=[{id:'m0',who:'bot',text:'안녕! 나 DOVIS야.\n설정 → 데이터 → "백업 붙여넣기"로 기존 일정을 옮기거나, 여기서 할 일과 일정을 말해줘.'}];x.v=5;return x;}
S=loadLocal()||(STANDALONE&&location.protocol!=='file:'&&!/claude/.test(location.hostname)?emptySeed():seed());
function migrate(){
  if((S.v||1)>=2)return false;
  const sh={'tue-lab':'생화학실','tue-inorg':'무기화학','thu-anat':'해생','thu-org':'유기화학','fri-biochem':'생화학','mon-nat':'천연물','thu-nat':'천연물','mon-hyunsa':'현사남','wed-lab':'약분실'};
  (S.fixed||[]).forEach(f=>{if(sh[f.id])f.short=sh[f.id];});
  (S.events||[]).forEach(e=>{
    if(e.date==='2026-11-13'&&e.title==='합주 · 등대'&&e.start==='19:00'&&e.end==='21:00')e.end='20:00';
    if(e.kind==='task'&&/정리본/.test(e.title||''))e.short='정리본';
  });
  (S.pool||[]).forEach(p=>{if(/정리본/.test(p.title||''))p.short='정리본';});
  S.v=2;return true;
}
function migrate3(){let ch=false;if((S.v||1)<3){if(S.gsync)S.gsync.sleep=false;S.v=3;ch=true;}if(S.v<4){if(S.gsync){S.gsync.push=false;S.gsync.map={};S.gsync.status='';}S.v=4;ch=true;}
  if(S.v<5){S.feelDow=Object.assign({0:'busy',1:'busy',2:'ok',3:'ok',4:'some'},S.feelDow||{});S.feelRef=Object.assign({0:4,1:0,2:1,3:0,4:3},S.feelRef||{});S.v=5;ch=true;}
  return ch;}
const ui={tab:'today',todayMode:'day',date:nowInfo().date,week:weekStart(nowInfo().date),sheet:null,prop:null,busy:false,form:false,formKind:'task',
  fDur:120,fType:'study',fSplit:true,draft:'',advice:null,adviceBusy:false,toast:null,dialog:null,sync:'local',reasonFor:null};
let cloudRef=null, writing=false, writeAgain=false, saveTimer=null, lastCloudJson='';

async function pushCloud(){

async function initCloud(){

    if(!user||!db)return;

    const timer=setTimeout(()=>{if(ui.sync==='loading'){ui.sync='slow';render();}},10000);
    ref.onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(timer);
      cloudRef=ref;
      if(snap.exists){
        const body=snap.data()||{};
        if(body.json&&body.json!==lastCloudJson&&!snap.metadata.hasPendingWrites){
          lastCloudJson=body.json;
          if((body.updatedAt||0)>(S.updatedAt||0)){try{S=JSON.parse(body.json);localStorage.setItem(LS_KEY,body.json);if(migrate()|migrate3())commit({silent:true});}catch(e){}}
          else if((body.updatedAt||0)<(S.updatedAt||0)){pushCloud();}
        }
      }else if(!snap.metadata.fromCache){pushCloud();}
      if(!snap.metadata.fromCache)ui.sync='cloud';
      render();
    },err=>{clearTimeout(timer);cloudRef=null;ui.sync='local';render();});
  }catch(e){}
}

function travelMin(a,b){
  if(!a||!b||a===b)return 0;
  const T=S.travel;const zone=p=>(['school','student','gym'].includes(p)?'campus':p);
  const x=zone(a),y=zone(b);if(x===y)return T.campus;
  const k=[x,y].sort().join('-');
  const map={'campus-home':T.homeSchool,'home-tutor':T.homeTutor,'academy-home':T.homeAcademy,'campus-practice':T.schoolPractice,
    'campus-tutor':T.homeSchool,'academy-campus':T.homeSchool,'home-practice':T.homeSchool,'practice-tutor':T.homeSchool,'academy-tutor':15};
  if(map[k]!=null)return map[k];
  if(x==='other'||y==='other'||x==='seoul'||y==='seoul')return 0;
  return 20;
}
function eventsOn(date){
  const out=[];const d=dow(date);const sk=S.skips[date]||[];
  if(date>=SEM_START&&date<=SEM_END){
    for(const f of S.fixed){
      if(f.day!==d)continue;
      const conf=S.confirm[date+':'+f.id];
      let state='on';
      if(sk.includes(f.id))state='off';
      else if(f.mode==='usuallyOff')state=conf==='on'?'on':'off';
      else if(f.mode==='check')state=conf||'unknown';
      out.push(Object.assign({},f,{uid:'f:'+f.id+':'+date,fid:f.id,date,kind:'fixed',recurring:true,state}));
    }
  }
  for(const e of S.events)if(e.date===date)out.push(Object.assign({},e,{uid:e.id,state:e.cancelled?'off':'on'}));
  for(const e of (S.gimported||[]))if(e.date===date)out.push(Object.assign({},e,{uid:e.id,state:'on'}));
  const key=e=>(e.allDay||e.tbd)?-1:toMin(e.start);
  return out.sort((a,b)=>key(a)-key(b));
}
const isTimed=e=>!e.allDay&&!e.tbd&&e.start;
const isBusy=e=>isTimed(e)&&e.state!=='off'&&!(e.kind==='task'&&e.status==='miss');
function wakeMin(date){
  const ev=eventsOn(date).filter(e=>e.kind==='fixed'&&isTimed(e)&&e.state!=='off');
  const latest=toMin(S.settings.latestWake);
  if(!ev.length)return latest;
  const cls=ev.filter(e=>e.cat==='class');
  const first=Math.min(...(cls.length?cls:ev).map(e=>toMin(e.start)));
  const anyFirst=Math.min(...ev.map(e=>toMin(e.start)));
  return Math.min(Math.min(first,anyFirst)-S.settings.wakeBeforeMin,latest);
}
function firstAnchor(date){
  const ev=eventsOn(date).filter(e=>e.kind==='fixed'&&isTimed(e)&&e.state!=='off');
  return ev.length?ev[0]:null;
}
function lightsOff(date){return 1440+wakeMin(addDays(date,1))-S.settings.sleepMin-S.settings.fallAsleepMin;}
function loadMin(date){return eventsOn(date).filter(isBusy).reduce((s,e)=>s+toMin(e.end)-toMin(e.start),0);}
function blockedDay(date){return eventsOn(date).some(e=>e.allDay&&e.state!=='off');}
function tbdDay(date){return eventsOn(date).some(e=>e.tbd&&e.state!=='off');}
function gaps(date,place){
  const n=nowInfo();
  if(date<n.date||blockedDay(date))return [];
  const timed=eventsOn(date).filter(isBusy).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if(dow(date)<5&&!timed.some(e=>toMin(e.start)<770&&toMin(e.end)>720))timed.push({start:'12:00',end:'12:50',place:null,meal:true,short:'점심'});
  ruleBlocks(date).forEach(b=>timed.push(b));
  timed.sort((a,b)=>toMin(a.start)-toMin(b.start));
  let ws=wakeMin(date)+90;
  let we=Math.min(toMin(S.settings.dayEnd),lightsOff(date)-90);
  if(S.settings.rules.noAfterWork){
    const w=timed.filter(e=>e.cat==='work');
    if(w.length)we=Math.min(we,Math.max(...w.map(e=>toMin(e.start))));
  }
  if(date===n.date)ws=Math.max(ws,roundUp5(n.min+10));
  const res=[];let prevEnd=ws,prevPlace='home',prevEv=null;
  const push=(s,e,pp,np,pe)=>{const st=roundUp5(s+travelMin(pp,place));const en=e-(np?travelMin(place,np):0);if(en-st>=30)res.push({date,s:st,e:en,prevPlace:pp,nextPlace:np,prevEv:pe});};
  for(const ev of timed){
    const s=toMin(ev.start),e=toMin(ev.end);
    if(s>=we){if(prevEnd<we)push(prevEnd,we,prevPlace,ev.place||null,prevEv);prevEnd=we;break;}
    if(e<=prevEnd){if(!ev.meal){prevPlace=ev.place||prevPlace;prevEv=ev;}continue;}
    if(s>prevEnd)push(prevEnd,s,prevPlace,ev.meal?null:(ev.place||'school'),prevEv);
    prevEnd=Math.max(prevEnd,e);if(!ev.meal){prevPlace=ev.place||prevPlace;prevEv=ev;}
  }
  if(prevEnd<we)push(prevEnd,we,prevPlace,null,prevEv);
  return res;
}
function workDay(date){return eventsOn(date).some(e=>e.cat==='work'&&e.state!=='off'&&isTimed(e));}
function buildReasons(task,date,g,start,dates,rank,isLast){
  const r=[];const load=loadMin(date);
  r.push(dayLabel(date)+' 일정이 '+durText(load)+'이라 마감 전 날 중에 '+(rank===0?'가장 여유로워':'여유 있는 편이야'));
  if(g.prevEv&&start===g.s){
    const tv=travelMin(g.prevPlace,task.place);
    if(tv===0)r.push('앞 일정('+(g.prevEv.short||g.prevEv.title)+') 끝나고 같은 곳에서 바로 시작');
    else r.push(PLACES[g.prevPlace]+'에서 이동 '+tv+'분 포함해서 잡았어');
  }
  if(task.type==='workout'&&isLast)r.push('그날 집 가기 직전 시간이야');
  const left=daysBetween(date,task.deadline);
  if(left>0)r.push('마감 '+dayLabel(task.deadline)+'까지 '+left+'일 여유 남겨뒀어');
  else r.push('마감 당일이야. 미루면 안 돼!');
  if(S.settings.rules.noAfterWork&&workDay(date))r.push('과외·학원 끝난 뒤엔 안 넣는 규칙 지켰어');
  if(tbdDay(date))r.push('이날 시간 미정인 약속이 있어서 확정되면 다시 확인할게');
  return r;
}
function candidates(task){
  const n=nowInfo();
  let from=task.from&&task.from>n.date?task.from:n.date;
  const dates=[];for(let d=from;d<=task.deadline&&dates.length<28;d=addDays(d,1))dates.push(d);
  const out=[];
  dates.forEach((date,di)=>{
    const gs=gaps(date,task.place);const load=loadMin(date);
    gs.forEach((g,i)=>{
      const isLast=i===gs.length-1;
      let score=load+di*20+(date===task.deadline?90:0)+(tbdDay(date)?120:0)+(dow(date)>=5?40:0);
      if(task.type==='workout')score+=isLast?-300:0;
      if(task.type==='study'&&g.prevEv&&travelMin(g.prevPlace,task.place)===0)score-=20;
      out.push({date,g,score,isLast,len:g.e-g.s});
    });
  });
  return {dates,list:out.sort((a,b)=>a.score-b.score)};
}
function singleOptions(task){
  const {dates,list}=candidates(task);
  const fit=list.filter(c=>c.len>=task.durationMin);
  const seen=new Set();const opts=[];
  for(const c of fit){
    if(seen.has(c.date))continue;seen.add(c.date);
    const start=c.g.s;
    const rank=opts.length;
    opts.push({kind:'single',slots:[{date:c.date,start:hm(start),end:hm(start+task.durationMin)}],
      reasons:buildReasons(task,c.date,c.g,start,dates,rank,c.isLast)});
    if(opts.length>=3)break;
  }
  return opts;
}
function splitOption(task){
  const {list}=candidates(task);
  const usable=list.filter(c=>c.len>=60).sort((a,b)=>(a.score-Math.min(a.len,task.durationMin)*1.5)-(b.score-Math.min(b.len,task.durationMin)*1.5));
  const slots=[];let remain=task.durationMin;const usedDay={};
  for(const c of usable){
    if(remain<=0)break;
    if(usedDay[c.date])continue;
    let take=Math.min(c.len,remain);
    if(remain-take>0&&remain-take<60)take=Math.max(60,remain-60);
    take=Math.min(c.len,Math.floor(take/15)*15);
    if(take<60)continue;
    slots.push({date:c.date,start:hm(c.g.s),end:hm(c.g.s+take)});usedDay[c.date]=1;remain-=take;
  }
  if(remain>0||slots.length<2)return null;
  slots.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  return {kind:'split',slots,reasons:['한 번에 '+durText(task.durationMin)+' 넣는 대신 '+slots.length+'번으로 나눴어','날마다 일정이 적은 순서로 골랐어','마감 '+dayLabel(task.deadline)+' 전에 다 끝나']};
}

    const todo=Object.keys(want).filter(k=>!(g.map[k]&&g.map[k].gid&&g.map[k].h===JSON.stringify(want[k].body)));let step=0;
    for(const k of todo){

      if(cur.gid){try{await mcp.callTool(GCAL,'delete_event',{eventId:cur.gid,notificationLevel:'NONE'},{cache:false});}catch(e){if(e&&e.code!=='tool_error')throw e;}}

function habitRows(days){
  const n=nowInfo();let bfc=0,woc=0,pastD=0,wkD=0;
  const cell=(d,k)=>{
    const dd=S.daily[d]||{};const on=k==='workout'?(!!dd.workout||workoutDone(d)):!!dd.breakfast;
    const fut=d>n.date;const skip=k==='workout'&&dow(d)>=5;
    if(!fut){if(k==='breakfast'){pastD++;if(on)bfc++;}else if(!skip){wkD++;if(on)woc++;}}
    const col=k==='workout'?'var(--ok)':'var(--accent)';
    const inner=on?'<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="'+col+'"/><path d="M4.8 8.2l2.2 2.1 4.2-4.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      :'<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="'+(fut?'var(--line)':'#ADB5BD')+'" stroke-width="1.4"'+(fut||skip?' stroke-dasharray="2 2"':'')+'/></svg>';
    return '<button data-a="daily" data-k="'+k+'" data-d="'+d+'" '+(fut?'disabled':'')+' aria-pressed="'+on+'" aria-label="'+dayLabel(d)+' '+(k==='workout'?'운동':'아침')+'" style="border:none;background:none;height:30px;display:flex;align-items:center;justify-content:center;'+(fut?'cursor:default;':'')+'">'+inner+'</button>';
  };
  const r1=days.map(d=>cell(d,'breakfast')).join(''),r2=days.map(d=>cell(d,'workout')).join('');
  return '<div class="wk-all" style="padding:2px 6px;align-items:center"><div style="font-size:10px;color:var(--sub)">아침</div>'+r1+'</div>'+
    '<div class="wk-all" style="padding:2px 6px;align-items:center"><div style="font-size:10px;color:var(--sub)">운동</div>'+r2+'</div>'+
    '<div style="padding:4px 14px 10px;font-size:12px;color:var(--sub2)">이번 주 아침 <b>'+bfc+'/'+pastD+'</b> · 운동 <b>'+woc+'/'+wkD+'</b> (평일 기준, 눌러서 체크)</div>';
}

function renderChangeWeek(items,hide,hp){
  if(!items.length)return '';
  const n=nowInfo();const HS=8,HE=24,HP=hp||14;const H=(HE-HS)*HP;hide=hide||[];
  const weeks=[...new Set(items.map(it=>weekStart(it.date)))].sort().slice(0,2);
  return weeks.map(m=>{
    const days=[...Array(7)].map((_,i)=>addDays(m,i));
    const head=days.map(d=>'<div style="text-align:center;font-size:10px;color:'+(d===n.date?'var(--accent)':'var(--sub)')+';font-weight:'+(d===n.date?700:400)+'">'+DAYS[dow(d)]+'<br><b style="font-size:12px;color:var(--text)">'+parseYmd(d).getDate()+'</b></div>').join('');
    let hrs='';for(let h=HS;h<HE;h+=2)hrs+='<div style="position:absolute;top:'+((h-HS)*HP-5)+'px;font-size:9px;color:var(--sub)">'+h+'</div>';
    const pos=(a,b)=>{const st=toMin(a),en=toMin(b);return 'top:'+Math.max(0,(st-HS*60)/60*HP)+'px;height:'+Math.max(12,(en-Math.max(st,HS*60))/60*HP-1)+'px;';};
    const cols=days.map(d=>{
      let inner='';
      if(blockedDay(d))inner+='<div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 4px,transparent 4px,transparent 8px)"></div>';
      eventsOn(d).filter(isTimed).forEach(ev=>{
        if(ev.state==='off'||(ev.kind==='task'&&ev.status==='miss')||hide.includes(ev.uid)||hide.includes(ev.id))return;
        if(toMin(ev.end)<=HS*60)return;
        const style=ev.kind==='task'?'background:var(--card);border:1px solid '+taskColor(ev)+';':'background:'+catColor(ev.cat)+';opacity:.5;';
        inner+='<div style="position:absolute;left:1px;right:1px;'+pos(ev.start,ev.end)+'border-radius:3px;box-sizing:border-box;'+style+'"></div>';
      });
      items.filter(it=>it.date===d).forEach(it=>{
        if(it.kind==='from')inner+='<div style="position:absolute;left:1px;right:1px;'+pos(it.start,it.end)+'border-radius:4px;border:1.5px dashed var(--accent);background:var(--card);box-sizing:border-box;z-index:1"></div>';
        else if(it.kind==='remove')inner+='<div style="position:absolute;left:1px;right:1px;'+pos(it.start,it.end)+'border-radius:4px;border:1.5px dashed var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--card));color:var(--danger);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box;z-index:1">✕</div>';
        else inner+='<div style="position:absolute;left:0;right:0;'+pos(it.start,it.end)+'border-radius:5px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 0 0 2px var(--card)">'+esc(it.label||'새')+'</div>';
      });
      if(d===n.date&&n.min>HS*60)inner+='<div style="position:absolute;left:0;right:0;top:'+((n.min-HS*60)/60*HP)+'px;height:2px;background:var(--danger);z-index:3"></div>';
      return '<div style="position:relative;height:'+H+'px;border-left:1px solid var(--line2);background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% '+(HP*2)+'px">'+inner+'</div>';
    }).join('');
    return '<div style="background:var(--input);border-radius:14px;padding:8px 6px 6px;display:flex;flex-direction:column;gap:4px">'+
      '<b style="font-size:12px;padding:0 4px">'+md(m)+' – '+md(addDays(m,6))+'</b>'+
      '<div style="display:grid;grid-template-columns:20px repeat(7,minmax(0,1fr))"><div></div>'+head+'</div>'+
      '<div style="display:grid;grid-template-columns:20px repeat(7,minmax(0,1fr))"><div style="position:relative;height:'+H+'px">'+hrs+'</div>'+cols+'</div>'+
      '<div class="muted" style="padding:2px 4px">파란 블록 = 새 자리'+(items.some(i=>i.kind==='from')?' · 점선 = 원래 자리':'')+(items.some(i=>i.kind==='remove')?' · 빨간 ✕ = 빠지는 일정':'')+'</div></div>';
  }).join('');
}
function changeItems(cs){
  const items=[],hide=[];
  cs.forEach(c=>{
    const e=c.ev;
    if(c.op==='edit'){if(isTimed(e)){items.push({kind:'from',date:e.date,start:e.start,end:e.end});hide.push(e.uid);}if(c.start)items.push({kind:'to',date:c.date,start:c.start,end:c.end,label:(c.title||e.short||e.title).slice(0,3)});}
    else if(c.op==='cancel'||c.op==='delete'){if(isTimed(e)){items.push({kind:'remove',date:e.date,start:e.start,end:e.end});hide.push(e.uid);}}
    else if(c.op==='restore'&&isTimed(e))items.push({kind:'to',date:e.date,start:e.start,end:e.end,label:(e.short||e.title).slice(0,3)});
  });
  return {items,hide};
}

function weekStats(m){
  const days=[...Array(7)].map((_,i)=>addDays(m,i));const n=nowInfo();
  const cat={class:0,work:0,drum:0,etc:0},task={study:0,practice:0,workout:0,etc:0};
  let done=0,miss=0;const reasons={};let bf=0,wo=0,pastDays=0,weekdaysPast=0;const memos=[];
  const perDay=days.map(d=>{let load=0;eventsOn(d).filter(isBusy).forEach(e=>{const l=toMin(e.end)-toMin(e.start);load+=l;if(e.kind==='task')task[e.type]=(task[e.type]||0)+l;else cat[e.cat]=(cat[e.cat]||0)+l;});return {d,load};});
  S.events.filter(e=>e.kind==='task'&&e.date>=m&&e.date<=days[6]).forEach(e=>{if(e.status==='done')done++;if(e.status==='miss'){miss++;if(e.reason)reasons[e.reason]=(reasons[e.reason]||0)+1;}});
  days.forEach(d=>{if(d<=n.date){pastDays++;const x=S.daily[d]||{};if(x.breakfast)bf++;if(dow(d)<5){weekdaysPast++;if(x.workout||workoutDone(d))wo++;}if(x.memo)memos.push(dayLabel(d)+': '+x.memo);}});
  return {days,cat,task,done,miss,reasons,bf,wo,pastDays,weekdaysPast,perDay,memos};
}
function adviceRules(st){
  const a=[];
  const busiest=st.perDay.filter(x=>dow(x.d)<5).sort((x,y)=>y.load-x.load)[0];
  if(busiest)a.push({t:DAYS[dow(busiest.d)]+'요일이 제일 빡빡해',b:'일정이 '+durText(busiest.load)+'이야. 이날엔 새 할 일을 최대한 안 넣을게.'});
  const total=st.done+st.miss;
  if(total>=3&&st.done/total<0.6)a.push({t:'계획이 좀 타이트한 것 같아',b:'이번 주 할 일 '+total+'개 중 '+st.miss+'개를 못 했어. 다음 주는 여유를 더 두고 짤게.'});
  const tired=st.reasons['피곤했어']||0;

const DOWW={'월':0,'화':1,'수':2,'목':3,'금':4,'토':5,'일':6};
function parseHour(str){
  const m=str.match(/(오전|오후|아침|낮|저녁|밤|새벽)?\s*(\d{1,2})\s*시\s*(반|(\d{1,2})\s*분)?/);if(!m)return null;
  let h=+m[2];const mm=m[3]==='반'?30:(m[4]?+m[4]:0);const ap=m[1];
  if((ap==='오후'||ap==='저녁'||ap==='밤')&&h<12)h+=12;if(ap==='낮'&&h<7)h+=12;if((ap==='새벽'||ap==='밤')&&h===12)h=24;
  return h*60+mm;
}
function parseRuleLocal(t){
  if(!/(마|말|안|금지|비워|빼|x|X|없이|쉬|막아)/.test(t))return null;
  let days=[0,1,2,3,4,5,6];
  if(/평일/.test(t))days=[0,1,2,3,4];else if(/주말/.test(t))days=[5,6];
  else{const ds=[...t.matchAll(/([월화수목금토일])요일/g)].map(m=>DOWW[m[1]]);if(ds.length)days=ds;}
  let start=null,end=null;
  const range=t.match(/(.{0,3}\d{1,2}\s*시[^~\-부]{0,4})\s*(?:~|-|부터)\s*(.{0,3}\d{1,2}\s*시.{0,3})/);
  if(range){start=parseHour(range[1]);end=parseHour(range[2]);if(start!=null&&end!=null&&end<=start&&end<720)end+=720;}
  else{const h=parseHour(t);if(h==null){if(/아침|오전/.test(t)){start=0;end=720;}else if(/저녁|밤/.test(t)){start=1080;end=1440;}else return null;}
    else if(/이후|넘어|부터|뒤|후에|후엔/.test(t)){start=h;end=1440;}else if(/전|이전|까지/.test(t)){start=0;end=h;}else return null;}
  if(start==null||end==null||end<=start)return null;
  return {days,start:hm(start),end:end>=1440?'24:00':hm(end)};
}

let toastTimer=null;
function showToast(t){ui.toast=t;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.toast=null;render();},2600);}
function botSay(text){S.chat.push({id:'m'+uid(),who:'bot',text});if(S.chat.length>60)S.chat=S.chat.slice(-60);}

function postponeOptions(id,day){
  const e=S.events.find(x=>x.id===id);if(!e)return {list:[],note:'할 일을 못 찾았어.'};const n=nowInfo();
  const dur=toMin(e.end)-toMin(e.start);
  const base={title:e.title,durationMin:dur,type:e.type,allowSplit:false,place:e.place};
  let task;
  if(day==='auto'){const from=addDays(n.date,1);task=Object.assign(base,{from,deadline:e.deadline&&e.deadline>=from?e.deadline:addDays(from,4)});}
  else task=Object.assign(base,{from:day,deadline:day});
  const saved=e.status;e.status='miss';
  const raw=singleOptions(task).map(o=>({slot:o.slots[0],reasons:o.reasons.slice(0,2),moves:[]}));
  // 운동처럼 옮길 수 있는 할 일을 비켜주고 넣는 안
  if(e.type!=='workout'){
    const flex=S.events.filter(x=>x.kind==='task'&&x.type==='workout'&&x.status==='scheduled'&&x.id!==e.id&&x.date>=task.from&&x.date<=task.deadline&&x.date>=n.date);
    flex.forEach(x=>{x._st=x.status;x.status='miss';});
    const bopts=singleOptions(task);
    flex.forEach(x=>{x.status=x._st;delete x._st;});
    for(const o of bopts){
      if(raw.length>=4)break;
      const sl=o.slots[0];if(raw.some(r=>r.slot.date===sl.date&&r.slot.start===sl.start))continue;
      const hit=flex.filter(x=>x.date===sl.date&&toMin(x.start)<toMin(sl.end)&&toMin(x.end)>toMin(sl.start));
      if(!hit.length)continue;
      const tmp=Object.assign({},e,{id:'tmp_post',date:sl.date,start:sl.start,end:sl.end,status:'scheduled'});S.events.push(tmp);
      const moves=[];let ok=true;
      for(const f of hit){
        const fd=toMin(f.end)-toMin(f.start);f.status='miss';
        let to=null;
        const gs=gaps(f.date,f.place).filter(g=>g.e-g.s>=fd);
        if(gs.length){const g=gs[gs.length-1];to={date:f.date,start:hm(g.s),end:hm(g.s+fd)};}
        else{for(let k=1;k<=3&&!to;k++){const d2=addDays(f.date,k);if(dow(d2)>=5||S.events.some(x=>x.date===d2&&x.type==='workout'&&x.id!==f.id))continue;const g2=gaps(d2,f.place).filter(g=>g.e-g.s>=fd);if(g2.length){const g=g2[g2.length-1];to={date:d2,start:hm(g.s),end:hm(g.s+fd)};}}}
        f.status='scheduled';
        if(!to){ok=false;break;}
        moves.push({id:f.id,name:f.short||f.title,from:{date:f.date,start:f.start,end:f.end},to});
      }
      S.events.pop();
      if(ok)raw.push({slot:sl,reasons:[o.reasons[0],(hit.map(h=>h.short||h.title).join(', '))+'을 옮기면 들어갈 수 있어'],moves});
    }
  }
  const list=raw.map(o=>{
    const sl=o.slot;const days=[...new Set([sl.date].concat(o.moves.map(m=>m.to.date)))];
    const before=dayAnalysis(sl.date);const loadB=loadMin(sl.date);
    const tmp=Object.assign({},e,{id:'tmp_post',date:sl.date,start:sl.start,end:sl.end,status:'scheduled'});S.events.push(tmp);
    const undo=o.moves.map(m=>{const f=S.events.find(x=>x.id===m.id);const old=[f.date,f.start,f.end];f.date=m.to.date;f.start=m.to.start;f.end=m.to.end;return ()=>{f.date=old[0];f.start=old[1];f.end=old[2];};});
    const after=dayAnalysis(sl.date);const loadA=loadMin(sl.date);
    const rows=eventsOn(sl.date).filter(isBusy).map(x=>({t:x.start+'–'+x.end,n:x.short||x.title,isNew:x.id==='tmp_post',moved:o.moves.some(m=>m.id===x.id)}));
    const lo=hm(lightsOff(sl.date));
    undo.forEach(f=>f());S.events.pop();
    const newWarn=after.warn.filter(w=>!before.warn.includes(w));
    return {slot:sl,reasons:o.reasons,moves:o.moves,rows,loadB,loadA,headline:after.headline,newWarn,lo};
  });
  e.status=saved;
  const note=day==='auto'?'마감 전에 '+durText(dur)+' 넣을 빈 시간이 없어. 날짜를 직접 골라봐.':dayLabel(day)+'엔 '+durText(dur)+' 넣을 빈 시간이 없어. 다른 날을 골라줘!';
  return {list,note};

async function pickGeminiModel(key){

    if(r.status===400||r.status===403){const j=await r.json().catch(()=>({}));throw {code:'bad_key',message:(j.error&&j.error.message)||'키가 올바르지 않아'};}

function normChange(c){

function reflowSuggestions(dates){
  const n=nowInfo();const out=[];const temp=[];
  [...new Set(dates)].filter(d=>d&&d>=n.date).sort().forEach(d=>{
    const tasks=S.events.filter(e=>e.date===d&&e.kind==='task'&&e.status==='scheduled'&&isTimed(e)&&!(d===n.date&&toMin(e.start)<=n.min+10))
      .sort((a,b)=>toMin(a.start)-toMin(b.start));
    tasks.forEach(t=>{
      const st0=toMin(t.start),dur=toMin(t.end)-st0;
      const overlap=eventsOn(d).some(o=>isBusy(o)&&o.uid!==t.id&&toMin(o.start)<toMin(t.end)&&toMin(o.end)>st0);
      const saved=t.status;t.status='miss';const gs=gaps(d,t.place);t.status=saved;
      let g=null;
      if(overlap)g=gs.filter(x=>x.e-x.s>=dur).sort((a,b)=>Math.abs(a.s-st0)-Math.abs(b.s-st0))[0];
      else g=gs.find(x=>x.e-x.s>=dur&&x.s<=st0-15&&x.e>=st0);
      if(!g){if(overlap)out.stuck=(out.stuck||[]).concat(DAYS[dow(d)]+'요일 '+(t.short||t.title));return;}
      const ns=g.s;const ev=eventsOn(d).find(e=>e.uid===t.id);
      out.push({op:'edit',ev,date:d,start:hm(ns),end:hm(ns+dur),title:t.title,overlap,
        text:t.start+'–'+t.end+' → '+hm(ns)+'–'+hm(ns+dur)});
      temp.push([t,t.start,t.end]);t.start=hm(ns);t.end=hm(ns+dur);
    });
  });
  temp.forEach(([t,a,b])=>{t.start=a;t.end=b;});
  return out;
}

    case 'tab':ui.tab=el.dataset.t;ui.sheet=null;if(el.dataset.t==='wrap')ui.wrapDate=el.dataset.d||n.date;if(el.dataset.t==='today'){ui.date=n.date;ui.todayMode='day';}if(el.dataset.form){ui.form=true;}if(el.dataset.t==='dovis')ui.scrollBottom=!el.dataset.form;try{history.replaceState(null,'','#'+(ui.tab==='setup'?'setup':ui.tab));}catch(e){}render();break;
    case 'day':ui.date=el.dataset.n==='0'?n.date:addDays(ui.date,+el.dataset.n);if(el.dataset.n==='0')ui.todayMode='day';render();break;
    case 'pickday':ui.date=el.dataset.d;ui.todayMode='day';render();break;
    case 'backday':ui.todayMode='day';ui.date=n.date;render();break;
    case 'feel':{const d=el.dataset.d,v=el.dataset.v;S.feel=S.feel||{};S.feelDow=S.feelDow||{};S.feelRef=S.feelRef||{};S.feel[d]=v;S.feelDow[dow(d)]=v;S.feelRef[dow(d)]=specialCount(d);commit({silent:true});showToast(DAYS[dow(d)]+'요일 체감 기억했어. 다음 주부터 반영할게');break;}
    case 'ruleTog':{const r=(S.rules||[]).find(x=>x.id===el.dataset.id);if(r){r.on=!r.on;commit();}break;}
    case 'ruleDel':{S.rules=(S.rules||[]).filter(x=>x.id!==el.dataset.id);commit();break;}
    case 'gkeyDel':saveGeminiKey('');break;
    case 'weekmode':ui.todayMode=ui.todayMode==='week'?'day':'week';render();break;
    case 'aiDay':aiDayAdvice(el.dataset.d);break;
    case 'wk':ui.week=el.dataset.n==='0'?weekStart(n.date):addDays(ui.week,+el.dataset.n);render();break;
    case 'gotoday':ui.date=el.dataset.d;ui.tab='today';ui.todayMode='day';render();break;
    case 'open':ui.sheet={id:el.dataset.id,date:el.dataset.date,step:null};render();break;
    case 'closeSheet':ui.sheet=null;render();break;
    case 'checkfirst':{const p=pendingChecks()[0];if(p){ui.sheet={id:p.id,date:p.date,step:null};render();}break;}
    case 'done':markDone(el.dataset.id);break;
    case 'missask':{const e=S.events.find(x=>x.id===el.dataset.id);if(e){ui.sheet={id:e.id,date:e.date,step:'reason'};render();}break;}
    case 'miss':markMiss(el.dataset.id,el.dataset.r);break;
    case 'undo':{const e=S.events.find(x=>x.id===el.dataset.id);if(e){e.status='scheduled';e.reason=null;}ui.sheet=null;commit();break;}
    case 'conf':if(el.dataset.v==='unsure'){S.unsure=S.unsure||{};S.unsure[el.dataset.key]=n.date;ui.sheet=null;commit({silent:true});showToast('알겠어! 일단 있는 걸로 비워두고, 전날 다시 물어볼게');break;}
    {S.confirm[el.dataset.key]=el.dataset.v;if(S.unsure)delete S.unsure[el.dataset.key];ui.sheet=null;afterChange([el.dataset.key.split(':')[0]]);commit({silent:true});showToast(el.dataset.v==='on'?'있는 걸로 반영했어':'휴강으로 반영했어. 그 시간 비워둘게');break;}
    case 'skip':{const d=el.dataset.date,id=el.dataset.id;const l=S.skips[d]=S.skips[d]||[];const i=l.indexOf(id);if(i>=0)l.splice(i,1);else l.push(id);ui.sheet=null;afterChange([d]);commit();break;}
    case 'cancelEv':{const e=S.events.find(x=>x.id===el.dataset.id);if(e)e.cancelled=!e.cancelled;ui.sheet=null;if(e)afterChange([e.date]);commit();break;}
    case 'delEv':{const e=S.events.find(x=>x.id===el.dataset.id);S.events=S.events.filter(x=>x.id!==el.dataset.id);ui.sheet=null;if(e)afterChange([e.date]);commit();break;}
    case 'applySuggest':{const g=ui.suggest;if(!g)break;g.changes.forEach(applyChange);ui.suggest=null;botSay('제안대로 옮겼어: '+g.changes.map(c=>dayLabel(c.date)+' '+(c.ev.short||c.ev.title)+' '+c.start).join(', '));commit({silent:true});showToast('옮겼어!');break;}
    case 'dismissSuggest':ui.suggest=null;render();break;
    case 'replan':postponeTask(el.dataset.id,'auto');break;
    case 'postask':if(ui.sheet){ui.sheet.step='postpone';ui.sheet.pday='auto';ui.sheet.popts=null;ui.sheet.psel=0;ui.sheet.pweek=null;render();}break;
    case 'pday':if(ui.sheet){ui.sheet.pday=el.dataset.d;ui.sheet.popts=null;ui.sheet.psel=0;ui.sheet.pweek=null;render();}break;
    case 'pselect':if(ui.sheet){ui.sheet.psel=+el.dataset.i;ui.sheet.pweek=null;render();}break;
    case 'pweek':if(ui.sheet){ui.sheet.pweek=el.dataset.d;const k=ui.sheet.popts.list.findIndex(o=>weekStart(o.slot.date)===el.dataset.d);if(k>=0)ui.sheet.psel=k;render();}break;
    case 'postApply':{const sh=ui.sheet;if(!sh||!sh.popts)break;const o=sh.popts.list[+el.dataset.i];if(o)applyPostpone(sh.id,o);break;}
    case 'daily':{const d=el.dataset.d,k=el.dataset.k;const cur=(S.daily[d]||{})[k]||(k==='workout'&&workoutDone(d));setDaily(d,{[k]:!cur});if(k==='workout'&&cur){S.events.forEach(e=>{if(e.date===d&&e.type==='workout'&&e.status==='done')e.status='scheduled';});}commit();break;}
    case 'toggleForm':ui.form=!ui.form;render();break;
    case 'fkind':ui.formKind=el.dataset.v;render();break;
    case 'fdur':ui.fDur=+el.dataset.v;keepForm();render();restoreForm();break;
    case 'fsplit':ui.fSplit=!ui.fSplit;keepForm();render();restoreForm();break;
    case 'approve':approveProp();break;
    case 'nextOpt':ui.prop.idx=(ui.prop.idx+1)%ui.prop.options.length;render();break;
    case 'useSplit':ui.prop.options.push(ui.prop.split);ui.prop.idx=ui.prop.options.length-1;ui.prop.split=null;render();break;
    case 'cancelProp':ui.prop=null;ui.queue=null;botSay('알겠어, 안 넣을게.');commit();break;
    case 'applyChanges':{const cs=ui.prop.changes;cs.forEach(applyChange);ui.prop=null;afterChange(cs.flatMap(c=>[c.ev.date,c.date]));botSay(cs.length+'개 바꿨어! '+cs.map(c=>md(c.ev.date)+' '+(c.ev.short||c.ev.title)).join(', '));ui.scrollBottom=true;commit();break;}
    case 'approveEvent':{const e=ui.prop.event;S.events.push(Object.assign({id:'e'+uid(),kind:'fixed',short:e.title.slice(0,8)},e));ui.prop=null;botSay('추가했어! '+dayLabel(e.date)+' '+(e.allDay?'하루 종일':e.tbd?'시간 미정':e.start+'–'+e.end)+' '+e.title);ui.scrollBottom=true;commit();break;}
    case 'placePool':{const p=S.pool.find(x=>x.id===el.dataset.id);if(p){ui.form=false;openPropFor(Object.assign({},p,{poolId:p.id}));}break;}
    case 'delPool':S.pool=S.pool.filter(x=>x.id!==el.dataset.id);commit();break;
    case 'quick':handleChat(el.dataset.v);break;
    case 'accent':S.settings.accent=el.dataset.v;commit();break;
    case 'dark':S.settings.dark=!S.settings.dark;commit();break;
    case 'rule':S.settings.rules[el.dataset.k]=!S.settings.rules[el.dataset.k];commit();break;
    case 'importAsk':ui.dialog={title:'백업 붙여넣기',body:'다른 기기나 claude.ai 버전에서 "백업 복사"한 내용을 붙여넣어줘. 지금 이 기기의 데이터는 덮어써져.',input:true,ok:'가져오기',okAction:'importDo',danger:true};render();break;
    case 'importDo':{const ta=document.getElementById('importin');let ok=false;try{const x=JSON.parse(ta.value);if(x&&Array.isArray(x.fixed)&&Array.isArray(x.events)&&x.settings){S=x;migrate();migrate3();ok=true;}}catch(e){}
      if(!ok){showToast('백업 내용이 올바르지 않아. 전체를 그대로 복사했는지 확인해줘');break;}
      ui.dialog=null;commit({silent:true});showToast('가져왔어! 일정 '+S.events.length+'개, 시간표 '+S.fixed.length+'개');break;}
    case 'export':ui.dialog={title:'백업 데이터',body:'아래 내용을 복사해서 보관해둬.',copy:JSON.stringify(S)};render();
      try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>showToast('복사했어!'),()=>{});}catch(e){}break;
    case 'resetAsk':ui.dialog={title:'처음 상태로 초기화할까?',body:'지금까지의 체크, 메모, 추가한 일정이 모두 사라져.\n폰·패드 모두에 적용돼.',ok:'초기화',okAction:'reset',danger:true};render();break;
    case 'reset':S=seed();ui.dialog=null;ui.prop=null;commit();showToast('초기화했어');break;
    case 'closeDialog':ui.dialog=null;render();break;
    case 'aiAdvice':aiAdvice();break;
    case 'edit':if(ui.sheet){ui.sheet.step='edit';render();}break;
    case 'editCancel':if(ui.sheet){ui.sheet.step=null;render();}break;
    case 'gsync':{const g=gState();g.on=!g.on;g.status=g.on?'연결 중…':'꺼짐';if(!g.on){stopGImport();S.gimported=[];}commit({silent:true,noSync:true});render();if(g.on){startGImport();if(g.push)gcalSync();}break;}
    case 'gpush':{const g=gState();g.push=!g.push;commit({silent:true,noSync:true});render();if(g.push&&g.on)gcalSync();break;}
    case 'gsleep':{const g=gState();g.sleep=!g.sleep;commit();break;}
    case 'gsyncNow':gcalSync();break;
    case 'gclearAsk':ui.dialog={title:'구글 캘린더에서 DOVIS 일정 지울까?',body:'DOVIS가 구글 캘린더에 넣은 일정만 지우고 동기화를 꺼. 네가 직접 만든 구글 일정은 안 건드려.',ok:'지우기',okAction:'gclear',danger:true};render();break;
    case 'gclear':ui.dialog=null;gcalClear();break;
  }
});
let formCache=null;
function keepForm(){const f=app.querySelector('#taskform');if(!f)return;const g=f.elements;formCache={title:g['title'].value,deadline:g['deadline'].value,type:g['type'].value};}
function restoreForm(){const f=app.querySelector('#taskform');if(!f||!formCache)return;const g=f.elements;g['title'].value=formCache.title;g['deadline'].value=formCache.deadline;g['type'].value=formCache.type;}
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target;const g=f.elements;
  if(f.id==='chatform'){const v=f.querySelector('#chatin').value;handleChat(v);return;}
  if(f.id==='taskform'){
    const title=g['title'].value.trim();if(!title)return;
    const type=g['type'].value;
    ui.form=false;formCache=null;
    S.chat.push({id:'m'+uid(),who:'me',text:title+' · '+durText(ui.fDur)+' · 마감 '+dayLabel(g['deadline'].value)});
    openPropFor({title,durationMin:ui.fDur,deadline:g['deadline'].value,type,allowSplit:ui.fSplit||!S.settings.rules.preferSingle});
    return;
  }
  if(f.id==='gkeyform'){saveGeminiKey(g['k'].value);return;}
  if(f.id==='ruleform'){const t=g['t'].value;addRule(t);return;}
  if(f.id==='postform'){const d=g['d'].value;if(d&&ui.sheet){ui.sheet.pday=d;ui.sheet.popts=null;ui.sheet.psel=0;ui.sheet.pweek=null;render();}return;}
  if(f.id==='editform'){
    const e=findEv(ui.sheet.id,ui.sheet.date);if(!e)return;
    const val=k=>g[k]?g[k].value:null;
    const title=val('title').trim();if(!title)return;
    const mode=val('mode')||'timed';const st=val('start'),en=val('end');
    if(mode==='timed'&&!(en>st)){showToast('끝나는 시간이 시작보다 늦어야 해');return;}
    const scope=ev.submitter&&ev.submitter.value;
    if(e.recurring){
      if(scope==='all'){
        const fx=S.fixed.find(x=>x.id===e.fid);if(fx){if(fx.title!==title){fx.title=title;fx.short=title.slice(0,6);}fx.start=st;fx.end=en;fx.place=val('place');fx.cat=val('cat')||fx.cat;}
        showToast('앞으로 매주 바꿨어');
      }else{
        const l=S.skips[e.date]=S.skips[e.date]||[];if(!l.includes(e.fid))l.push(e.fid);
        S.events.push({id:'e'+uid(),kind:'fixed',date:e.date,start:st,end:en,title,short:(title===e.title?e.short:title.slice(0,6)),cat:val('cat')||e.cat,place:val('place')});
        showToast(dayLabel(e.date)+'만 바꿨어');
      }
    }else{
      const x=S.events.find(y=>y.id===e.id);if(!x)return;
      x.title=title;if(title!==e.title)x.short=title.slice(0,8);
      x.date=val('date')||x.date;x.place=val('place');
      if(x.kind==='task'){x.type=val('type')||x.type;x.deadline=val('deadline')||x.deadline;x.start=st;x.end=en;}
      else{x.cat=val('cat')||x.cat;x.tbd=mode==='tbd';x.allDay=mode==='allDay';x.start=mode==='timed'?st:null;x.end=mode==='timed'?en:null;}
      showToast('수정했어');
    }
    afterChange([e.date,val('date')]);ui.sheet=null;commit();return;
  }
  if(f.id==='evform'){
    const mode=g['mode'].value;const title=g['title'].value.trim();if(!title)return;
    const e={id:'e'+uid(),kind:'fixed',title,short:title.slice(0,8),date:g['date'].value,cat:g['cat'].value,place:g['place'].value,start:null,end:null};
    if(mode==='timed'){if(!(g['end'].value>g['start'].value)){showToast('끝나는 시간이 시작보다 늦어야 해');return;}e.start=g['start'].value;e.end=g['end'].value;}
    else if(mode==='tbd')e.tbd=true;else e.allDay=true;
    S.events.push(e);ui.form=false;botSay('추가했어! '+dayLabel(e.date)+' '+(e.allDay?'하루 종일':e.tbd?'시간 미정':e.start+'–'+e.end)+' '+title);ui.scrollBottom=true;commit();
  }
});
let memoTimer=null;
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='chatin'){ui.draft=t.value;return;}
  if(t.dataset&&t.dataset.memo){const d=t.dataset.memo;setDaily(d,{memo:t.value});clearTimeout(memoTimer);memoTimer=setTimeout(()=>commit({silent:true}),700);return;}
  if(t.dataset&&t.dataset.num){const v=parseInt(t.value,10);if(isNaN(v))return;const [o,k]=t.dataset.num.split('.');(o==='t'?S.travel:S.settings)[k]=Math.max(0,Math.min(600,v));clearTimeout(memoTimer);memoTimer=setTimeout(()=>commit({silent:true}),500);}
});
function routeFromHash(){const h=(location.hash||'').slice(1);if(h==='report'){ui.tab='today';ui.todayMode='week';}else if(['today','week','dovis','setup','wrap'].includes(h))ui.tab=h;}
window.addEventListener('hashchange',()=>{routeFromHash();render();});
routeFromHash();
if(migrate()|migrate3())commit({silent:true});
ensureRecurring();
render();
setInterval(()=>{if(!ui.sheet&&!ui.dialog&&ui.tab!=='dovis'&&ui.tab!=='wrap'&&ui.tab!=='setup'){const sc=document.activeElement;if(!sc||sc===document.body)render();}},60000);
initCloud();
if(STANDALONE&&'serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){}}
setTimeout(()=>{if(S.gsync&&S.gsync.on){gcalSync();startGImport();}},3000);
</script>
