name: DOVIS 앱 빌드

on:
  push:
    paths:
      - 'android.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 앱 소스 풀기
        run: unzip -o android.zip -d android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 만들기
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk DOVIS.apk

      - name: 다운로드 페이지에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: DOVIS 앱 (최신)
          body: 이 페이지에서 DOVIS.apk를 받아서 설치해줘.
          files: DOVIS.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: DOVIS-apk
          path: DOVIS.apk
